[project]
name = "jaxrl"
version = "0.1.0"
description = "Imitation learning from scratch in JAX: BC and DAgger on CartPole with an LQR expert."
requires-python = ">=3.12"
dependencies = [
    "jax[cpu]>=0.4.35",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "control>=0.10",
    "optax>=0.2",
    "flax>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaxrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
# Pyrefly does not read the editor's Python interpreter setting, so it has to be
# told separately or it queries whatever `python3` is on PATH -- here, miniconda.
python-interpreter-path = ".venv/bin/python"
project-includes = ["src", "tests"]
